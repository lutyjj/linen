name: Release

# A version tag builds the package from the locked dependencies, which runs
# every check, and attaches the tarball to the tag's release.
on:
    push:
        tags: ["v*"]

permissions: {}

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write # creates the release and uploads the tarball to it
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
            - name: Build the package
              run: nix build
            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  tarball="result/linen-${TAG#v}.tgz"
                  if [ ! -f "$tarball" ]; then
                    echo "::error::$TAG does not name the version in package.json"
                    exit 1
                  fi
                  gh release create "$TAG" "$tarball" --repo "$GITHUB_REPOSITORY" \
                    --verify-tag --title "linen ${TAG#v}" --generate-notes
