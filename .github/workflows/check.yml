name: Check

# Every push to main and every pull request builds the package from the
# locked dependencies, which runs every check, as a release does.
on:
    push:
        branches: [main]
    pull_request:

permissions: {}

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read # checks out the repository
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
            - name: Check
              run: nix flake check
